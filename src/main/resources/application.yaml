spring:
  application:
    name: project-template
  datasource:
    url: jdbc:postgresql://localhost:5432/dpt_db_template
    driver-class-name: org.postgresql.Driver
    username: myuser
    password: 123456
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
